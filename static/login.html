<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HawkZero // Operator sign in</title>
<style>
:root{
  --bg0:#040507; --panel:rgba(13,17,24,.72); --line:rgba(255,255,255,.08);
  --txt:#e9eef7; --dim:#7f8b9f; --dim2:#525d70;
  --accent:#57c8ff; --accent2:#8a6bff; --live:#3ddc97; --bad:#ff5f6b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg0); color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  display:grid; place-items:center; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ambient field: aurora + fine grid, no gimmicks */
.field{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.field:before{
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(600px 420px at 20% 15%, rgba(87,200,255,.10), transparent 60%),
    radial-gradient(700px 520px at 85% 80%, rgba(138,107,255,.09), transparent 60%),
    radial-gradient(400px 300px at 65% 10%, rgba(61,220,151,.04), transparent 60%);
  animation:drift 26s ease-in-out infinite alternate;
}
.field:after{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
}
@keyframes drift{from{transform:translate3d(-2%,-2%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}

.card{
  position:relative;width:min(400px,calc(100vw - 40px));
  background:var(--panel); border:1px solid var(--line); border-radius:20px;
  padding:30px 28px 24px; backdrop-filter:blur(22px);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  animation:enter .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card:before{
  content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(87,200,255,.35),transparent 35%,transparent 65%,rgba(138,107,255,.3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px}
.avatar{width:74px;height:74px;border-radius:20px;position:relative;margin-bottom:14px;
  background:linear-gradient(140deg,rgba(87,200,255,.35),rgba(138,107,255,.35));padding:2px;
  box-shadow:0 0 30px rgba(87,200,255,.18),0 12px 30px rgba(0,0,0,.5)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block}
.word{font-size:24px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(92deg,#f2f7ff 20%,#a9c8ff 90%);-webkit-background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12px;margin-top:5px;letter-spacing:.02em}
.sub .chip{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);font-size:10px;color:var(--dim2);font-family:var(--mono)}

.fieldset{position:relative;margin-bottom:14px}
.fieldset label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px;font-weight:600}
.control{position:relative;display:flex;align-items:center}
.control .ico{position:absolute;left:12px;width:16px;height:16px;opacity:.55;pointer-events:none}
.control input{
  width:100%;background:#070a0e;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 12px 12px 36px;font-size:13px;transition:border-color .15s,box-shadow .15s;
}
.control input:focus{outline:none;border-color:rgba(87,200,255,.55);box-shadow:0 0 0 3px rgba(87,200,255,.10)}
.control input::placeholder{color:var(--dim2)}
.toggle{position:absolute;right:10px;background:none;border:0;color:var(--dim);cursor:pointer;
  font-size:11px;padding:4px 6px;border-radius:6px}
.toggle:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.caps{position:absolute;right:12px;top:-20px;font-size:10px;color:var(--warn);display:none}
.caps.on{display:block}

.totp{display:flex;gap:8px;justify-content:space-between}
.totp input{
  width:46px;height:52px;text-align:center;font-family:var(--mono);font-size:20px;font-weight:600;
  background:#070a0e;border:1px solid var(--line);color:var(--txt);border-radius:11px;
  transition:border-color .15s,box-shadow .15s,transform .1s;
}
.totp input:focus{outline:none;border-color:rgba(87,200,255,.6);box-shadow:0 0 0 3px rgba(87,200,255,.10);transform:translateY(-1px)}
.totp input.filled{border-color:rgba(87,200,255,.35);color:#fff}
.hint{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim2);margin-top:8px}
.hint button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:10.5px;padding:0}
.hint button:hover{color:var(--accent)}

.remember{display:flex;align-items:center;gap:9px;margin:16px 0 18px;cursor:pointer;user-select:none}
.remember input{appearance:none;width:16px;height:16px;border:1px solid var(--line);border-radius:5px;
  background:#070a0e;cursor:pointer;position:relative;flex:none}
.remember input:checked{background:linear-gradient(140deg,var(--accent),var(--accent2));border-color:transparent}
.remember input:checked:after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
  border:solid #04060a;border-width:0 2px 2px 0;transform:rotate(45deg)}
.remember span{font-size:12px;color:var(--dim)}

.submit{
  width:100%;padding:13px;border:0;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:650;
  color:#04070c;background:linear-gradient(92deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px rgba(87,200,255,.18),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .15s,box-shadow .15s,filter .15s;position:relative;overflow:hidden;
}
.submit:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07);
  box-shadow:0 16px 36px rgba(87,200,255,.26)}
.submit:disabled{opacity:.55;cursor:not-allowed}
.submit .spin{display:none;width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.25);
  border-top-color:#04070c;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}
.submit.loading .spin{display:inline-block}
.submit.loading .label{opacity:.75}
@keyframes spin{to{transform:rotate(360deg)}}

.error{display:none;margin-top:14px;padding:11px 12px;border-radius:11px;font-size:12px;
  background:rgba(255,95,107,.10);border:1px solid rgba(255,95,107,.30);color:#ffc9ce}
.error.on{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.ok{display:none;margin-top:14px;padding:11px 12px;border-radius:11px;font-size:12px;
  background:rgba(61,220,151,.10);border:1px solid rgba(61,220,151,.30);color:#bdf3d9}
.ok.on{display:block}

.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.foot .item{font-size:10px;color:var(--dim2);display:flex;align-items:center;gap:6px}
.foot .item b{color:var(--dim);font-weight:500}
.dot{width:5px;height:5px;border-radius:50%;background:var(--live);display:inline-block;box-shadow:0 0 7px var(--live)}
</style>
</head>
<body>
<div class="field"></div>

<form class="card" id="loginForm" autocomplete="off">
  <div class="brand">
    <div class="avatar"><img src="/static/hawkzero.jpg" alt="HawkZero"></div>
    <div class="word">HawkZero</div>
    <div class="sub">Operator sign in <span class="chip">iOS 18.4 – 26.x</span></div>
  </div>

  <div class="fieldset">
    <label for="username">Operator ID</label>
    <div class="control">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.4-4 4.4-6 7.5-6s6.1 2 7.5 6"/>
      </svg>
      <input id="username" name="username" placeholder="admin" autocomplete="username" autofocus required>
    </div>
  </div>

  <div class="fieldset">
    <label for="password">Password</label>
    <div class="control">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7.8A4 4 0 0 1 16 7.8v2.7"/>
      </svg>
      <input id="password" name="password" type="password" placeholder="••••••••••" autocomplete="current-password" required>
      <button class="toggle" type="button" id="showPw" aria-label="Show password">show</button>
      <span class="caps" id="capsHint">caps lock</span>
    </div>
  </div>

  <div class="fieldset">
    <label>Authenticator code</label>
    <div class="totp" id="totp">
      <input inputmode="numeric" maxlength="1" aria-label="digit 1">
      <input inputmode="numeric" maxlength="1" aria-label="digit 2">
      <input inputmode="numeric" maxlength="1" aria-label="digit 3">
      <input inputmode="numeric" maxlength="1" aria-label="digit 4">
      <input inputmode="numeric" maxlength="1" aria-label="digit 5">
      <input inputmode="numeric" maxlength="1" aria-label="digit 6">
    </div>
    <div class="hint">
      <span>6-digit code from your authenticator</span>
      <button type="button" id="pasteHint">paste</button>
    </div>
  </div>

  <label class="remember">
    <input type="checkbox" id="trust" checked>
    <span>Trust this device for 30 days</span>
  </label>

  <button class="submit" id="submitBtn" type="submit">
    <span class="spin"></span><span class="label">Sign in to HawkZero</span>
  </button>

  <div class="error" id="errorBox" role="alert"></div>
  <div class="ok" id="okBox"></div>

  <div class="foot">
    <div class="item"><span class="dot"></span><b>TOTP secured</b></div>
    <div class="item">5 attempts · 60s lockout</div>
    <div class="item">v2.0</div>
  </div>
</form>

<script>
const $ = s => document.querySelector(s);
const form = $('#loginForm'), btn = $('#submitBtn'), err = $('#errorBox'), ok = $('#okBox');
const digits = Array.from(document.querySelectorAll('#totp input'));

function showError(msg){
  err.textContent = msg; err.classList.remove('on'); void err.offsetWidth; err.classList.add('on');
  ok.classList.remove('on');
}
function clearError(){ err.classList.remove('on'); }

/* password visibility + caps lock */
$('#showPw').onclick = () => {
  const p = $('#password');
  const showing = p.type === 'text';
  p.type = showing ? 'password' : 'text';
  $('#showPw').textContent = showing ? 'show' : 'hide';
};
$('#password').addEventListener('keyup', e => {
  if(e.getModifierState) $('#capsHint').classList.toggle('on', e.getModifierState('CapsLock'));
});

/* segmented TOTP input */
function totpValue(){ return digits.map(d=>d.value).join(''); }
digits.forEach((d,i)=>{
  d.addEventListener('input', () => {
    d.value = d.value.replace(/\D/g,'').slice(-1);
    d.classList.toggle('filled', !!d.value);
    clearError();
    if(d.value && i < digits.length-1) digits[i+1].focus();
    if(totpValue().length === 6) form.requestSubmit();
  });
  d.addEventListener('keydown', e => {
    if(e.key === 'Backspace' && !d.value && i > 0){ digits[i-1].focus(); digits[i-1].value=''; digits[i-1].classList.remove('filled'); e.preventDefault(); }
    if(e.key === 'ArrowLeft' && i>0) digits[i-1].focus();
    if(e.key === 'ArrowRight' && i<digits.length-1) digits[i+1].focus();
  });
  d.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
    if(!text) return;
    text.split('').forEach((c,j)=>{ if(digits[j]){ digits[j].value=c; digits[j].classList.add('filled'); } });
    digits[Math.min(text.length,5)].focus();
    if(totpValue().length === 6) form.requestSubmit();
  });
});
$('#pasteHint').onclick = async () => {
  try{
    const text = (await navigator.clipboard.readText()).replace(/\D/g,'').slice(0,6);
    text.split('').forEach((c,j)=>{ if(digits[j]){ digits[j].value=c; digits[j].classList.add('filled'); } });
    if(totpValue().length === 6) form.requestSubmit();
  }catch(e){ digits[0].focus(); }
};

/* submit */
form.addEventListener('submit', async e => {
  e.preventDefault();
  clearError();
  const username = $('#username').value.trim();
  const password = $('#password').value;
  const totp = totpValue();
  if(totp.length !== 6) return showError('Enter the full 6-digit authenticator code.');

  btn.disabled = true; btn.classList.add('loading');
  try{
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password, totp})
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      if(r.status === 429) showError(data.detail || 'Too many attempts. Wait and try again.');
      else showError(data.detail || 'Sign in failed. Check your credentials and code.');
      digits.forEach(d=>{ d.value=''; d.classList.remove('filled'); });
      digits[0].focus();
      return;
    }
    localStorage.setItem('ds_token', data.token);
    if(!$('#trust').checked) sessionStorage.setItem('ds_session_only','1');
    ok.textContent = 'Authenticated. Opening HawkZero…';
    ok.classList.add('on');
    setTimeout(()=>{ location.href = '/'; }, 500);
  }catch(ex){
    showError('Cannot reach the HawkZero server. Check your connection.');
  }finally{
    btn.disabled = false; btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
